version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install

  pre_build:
    commands:
      - echo "Running pre-build steps..."
      - npm run lint || echo "Lint errors detected, continuing build"
      - npm test || echo "Tests failed, continuing build"

  build:
    commands:
      - echo "Building application..."
      - npm run build || echo "No build script defined, skipping..."

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Preparing artifact..."

artifacts:
  files:
    - '**/*'
  discard-paths: no

